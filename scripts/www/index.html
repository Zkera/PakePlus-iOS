    <script>
      (() => {
        const selectors = [
          'layero-badge',
          'script[data-layero-footer]'
        ];

        function removeLayero() {
          document.querySelectorAll(selectors.join(',')).forEach(el => {
            el.remove();
          });
        }

        // удалить сразу
        removeLayero();

        // следить за новыми элементами
        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
              if (!(node instanceof Element)) continue;

              if (
                      node.matches?.(selectors.join(',')) ||
                      node.querySelector?.(selectors.join(','))
              ) {
                removeLayero();
                break;
              }
            }
          }
        });

        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      })();

      const originalDefine = customElements.define;

      customElements.define = function(name, ctor, options) {
        if (name === 'layero-badge') {
          return;
        }

        return originalDefine.call(this, name, ctor, options);
      };
    </script>
